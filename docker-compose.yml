services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64   # official image has no arm64 build; needed for Apple Silicon, harmless elsewhere
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run setup Postgres listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email in development. Read the codes at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ./api
      args:
        REQUIREMENTS: requirements-dev.txt
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-CivicPulse <no-reply@civicpulse.local>}
      MEDIA_DIR: /data/media
      # Where clients fetch photos from. Use your LAN address when testing on a phone.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8001}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - media:/data/media
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  # Serves stored photos from a different origin than the API and dashboard (Module 3).
  media:
    build:
      context: ./api
    environment:
      MEDIA_DIR: /data/media
    ports:
      - "${MEDIA_PORT:-8001}:8001"
    volumes:
      - ./api:/app
      - media:/data/media:ro
    command: uvicorn app.media:media_app --host 0.0.0.0 --port 8001

volumes:
  pgdata:
  media:
